<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxBed - Премиальное постельное белье</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>LuxBed</h1>
                    <span class="logo-subtitle">Premium Bedding</span>
                </div>
                
                <nav class="nav">
                    <a href="#" class="nav-link active">Главная</a>
                    <a href="#" class="nav-link">Коллекции</a>
                    <a href="#" class="nav-link">О нас</a>
                    <a href="#" class="nav-link">Контакты</a>
                </nav>

                <div class="header-actions">
                    <button class="search-btn" aria-label="Поиск">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="2"/>
                            <path d="M14 14L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="cart-btn" id="cartBtn" aria-label="Корзина">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M9 2L7 6M17 2L19 6M3 6H21M19 6L18 20H6L5 6M10 10V16M14 10V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h2 class="hero-title">Роскошь в каждой детали</h2>
                <p class="hero-subtitle">Откройте для себя коллекцию премиального постельного белья</p>
                <button class="hero-btn">Смотреть коллекцию</button>
            </div>
        </div>
    </section>

    <!-- Products Section -->
    <section class="products">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Наша коллекция</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="cotton">Хлопок</button>
                    <button class="filter-btn" data-filter="silk">Шелк</button>
                    <button class="filter-btn" data-filter="linen">Лен</button>
                </div>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-overlay" id="cartOverlay"></div>
        <div class="cart-panel">
            <div class="cart-header">
                <h3>Корзина</h3>
                <button class="cart-close" id="cartClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be generated by JavaScript -->
            </div>

            <div class="cart-footer">
                <div class="cart-total">
                    <span>Итого:</span>
                    <span class="cart-total-price" id="cartTotal">0 ₽</span>
                </div>
                <button class="checkout-btn">Оформить заказ</button>
                <button class="continue-shopping" id="continueShopping">Продолжить покупки</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
